# EMP-Guardian - Dependabot configuration
# Autor: Ciprian Ștefan Pleșca
#
# Verifică săptămânal dependențele Python (software/monitor și software/api)
# și deschide automat pull request-uri pentru actualizări de versiune.
# Actualizările de securitate (vulnerabilități cunoscute) sunt gestionate
# separat de "Dependabot security updates", activat din Settings.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/software/monitor"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "pip"
    directory: "/software/api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
