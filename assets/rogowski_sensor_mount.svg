<svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/>
    </marker>
  </defs>

  <rect width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#111">EMP-Guardian — Rogowski Coil Sensor Mounting</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#666">Toroidal air-core coil around the monitored conductor, feeding the conditioning circuit</text>

  <!-- ============ Left: axial/side view ============ -->
  <g transform="translate(90,100)">
    <text x="150" y="-15" text-anchor="middle" font-size="13" font-weight="700" fill="#0b3d91">SIDE VIEW</text>

    <!-- monitored conductor, running through the coil -->
    <line x1="-20" y1="120" x2="330" y2="120" stroke="#7a4420" stroke-width="10" stroke-linecap="round"/>
    <text x="-20" y="100" font-size="10.5" fill="#7a4420">Monitored conductor</text>
    <text x="-20" y="150" font-size="9.5" fill="#7a4420">(mains feed / lead to protected load)</text>

    <!-- coil torus, side profile as an ellipse ring -->
    <ellipse cx="150" cy="120" rx="34" ry="80" fill="none" stroke="#0b3d91" stroke-width="14" opacity="0.85"/>
    <ellipse cx="150" cy="120" rx="34" ry="80" fill="none" stroke="#0a2a63" stroke-width="1.5" stroke-dasharray="2 4"/>
    <text x="150" y="15" text-anchor="middle" font-size="11" font-weight="600" fill="#0b3d91">Rogowski coil</text>
    <text x="150" y="29" text-anchor="middle" font-size="9.5" fill="#0b3d91">(N turns, uniformly wound, air core)</text>

    <!-- coil ends / output leads -->
    <path d="M150,40 C 210,40 230,70 230,100" fill="none" stroke="#222" stroke-width="2"/>
    <path d="M150,200 C 210,200 230,170 230,140" fill="none" stroke="#222" stroke-width="2"/>
    <circle cx="230" cy="100" r="3" fill="#222"/>
    <circle cx="230" cy="140" r="3" fill="#222"/>
    <line x1="230" y1="100" x2="290" y2="100" stroke="#222" stroke-width="2"/>
    <line x1="230" y1="140" x2="290" y2="140" stroke="#222" stroke-width="2"/>
    <text x="295" y="104" font-size="10">out+</text>
    <text x="295" y="144" font-size="10">out&#8722;</text>
    <text x="230" y="80" font-size="9" fill="#555" text-anchor="middle">return wire threaded back</text>
    <text x="230" y="68" font-size="9" fill="#555" text-anchor="middle">through the winding (self-shielding)</text>

    <!-- dimension: mean length / area -->
    <line x1="116" y1="120" x2="184" y2="120" stroke="#333" stroke-width="0.75" stroke-dasharray="2 2"/>
    <text x="150" y="102" text-anchor="middle" font-size="9" fill="#333">loop area A</text>
    <line x1="150" y1="45" x2="150" y2="195" stroke="#333" stroke-width="0.75" stroke-dasharray="2 2"/>
    <text x="150" y="215" text-anchor="middle" font-size="9" fill="#333">mean path l</text>
  </g>

  <!-- ============ Right: signal chain from sensor ============ -->
  <g transform="translate(560,110)">
    <text x="190" y="-25" text-anchor="middle" font-size="13" font-weight="700" fill="#0b3d91">SENSOR &#8594; CONDITIONING &#8594; ADC</text>

    <rect x="0" y="0" width="150" height="46" rx="6" fill="#0b3d91"/>
    <text x="75" y="20" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">Rogowski coil</text>
    <text x="75" y="36" text-anchor="middle" font-size="9.5" fill="#dce6fa">V = M &#183; dI/dt</text>

    <line x1="150" y1="23" x2="200" y2="23" stroke="#0b3d91" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="200" y="0" width="180" height="46" rx="6" fill="#0b3d91"/>
    <text x="290" y="20" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">Integrator (optional)</text>
    <text x="290" y="36" text-anchor="middle" font-size="9.5" fill="#dce6fa">converts dI/dt output to I(t)</text>

    <line x1="90" y1="46" x2="90" y2="80" stroke="#0b3d91" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="0" y="80" width="230" height="46" rx="6" fill="#0b3d91"/>
    <text x="115" y="100" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">Instrumentation amp</text>
    <text x="115" y="116" text-anchor="middle" font-size="9.5" fill="#dce6fa">+ limiter (clamp diodes) + anti-alias filter</text>

    <line x1="115" y1="126" x2="115" y2="160" stroke="#0b3d91" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="20" y="160" width="190" height="46" rx="6" fill="#7a1f1f"/>
    <text x="115" y="180" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">ADC</text>
    <text x="115" y="196" text-anchor="middle" font-size="9.5" fill="#f2d9d9">&#8805;12-bit, &#8805;2 MSPS &#8594; detector</text>

    <!-- formula box -->
    <rect x="0" y="240" width="380" height="130" rx="6" fill="#fffaf0" stroke="#b58900" stroke-dasharray="5 4"/>
    <text x="14" y="262" font-size="11" font-weight="700" fill="#7a5c00">MUTUAL INDUCTANCE &amp; OUTPUT VOLTAGE</text>
    <text x="14" y="284" font-size="12" fill="#333" font-family="Georgia, serif" font-style="italic">M = &#956;&#8320; &#183; N &#183; A / l</text>
    <text x="14" y="304" font-size="12" fill="#333" font-family="Georgia, serif" font-style="italic">V_out = M &#183; dI/dt</text>
    <text x="14" y="326" font-size="9.5" fill="#555">N: turns, A: loop area, l: mean magnetic path length.</text>
    <text x="14" y="340" font-size="9.5" fill="#555">Air-core, uniformly-wound toroidal approximation.</text>
    <text x="14" y="356" font-size="9.5" fill="#555">See software/calculator/emp_calculator.py &#8594; rogowski_sensitivity()</text>
  </g>

  <!-- Mounting notes -->
  <g transform="translate(90,340)">
    <rect x="0" y="0" width="380" height="180" rx="6" fill="#eeeeee" stroke="#4a4a4a" stroke-width="1.2"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#4a4a4a">MOUNTING NOTES</text>
    <text x="14" y="44" font-size="10.5" fill="#333">1. Center the conductor in the coil aperture —</text>
    <text x="24" y="58" font-size="10.5" fill="#333">off-axis position changes effective coupling.</text>
    <text x="14" y="78" font-size="10.5" fill="#333">2. Keep the return lead threaded through the</text>
    <text x="24" y="92" font-size="10.5" fill="#333">winding to reject common-mode / external fields.</text>
    <text x="14" y="112" font-size="10.5" fill="#333">3. Route output leads as a twisted pair, shielded,</text>
    <text x="24" y="126" font-size="10.5" fill="#333">as short as practical to the conditioning amp.</text>
    <text x="14" y="146" font-size="10.5" fill="#333">4. Mount close to the enclosure feedthrough — see</text>
    <text x="24" y="160" font-size="10.5" fill="#333">assets/enclosure_cross_section.svg for the bushing.</text>
    <text x="14" y="174" font-size="9.5" fill="#7a1f1f" font-style="italic">Sensitivity is design-time only until calibrated — see docs/test_procedures.md.</text>
  </g>

  <text x="500" y="548" text-anchor="middle" font-size="10" fill="#888">Source: docs/hardware_specs.md (sensor), docs/theory_of_operation.md — EMP-Guardian, Ciprian &#536;tefan Ple&#537;ca</text>
  <text x="500" y="564" text-anchor="middle" font-size="10" fill="#888">Formula validated against software/calculator/emp_calculator.py::rogowski_sensitivity()</text>
</svg>
