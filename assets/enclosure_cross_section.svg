<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <pattern id="hatchCopper" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#c97a3d"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9a5a26" stroke-width="2"/>
    </pattern>
    <pattern id="hatchGasket" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#4a4a4a"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2a2a2a" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#111">EMP-Guardian — Shielded Enclosure, Wall Cross-Section</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#666">Faraday-cage wall detail at a seam / access panel — not to scale</text>

  <!-- ============ Cross section (left) ============ -->
  <g transform="translate(70,90)">
    <text x="150" y="-10" text-anchor="middle" font-size="13" font-weight="700" fill="#0b3d91">WALL BUILD-UP (seam detail)</text>

    <!-- Outer environment -->
    <text x="-20" y="130" font-size="11" fill="#888" text-anchor="end">Outside</text>
    <text x="330" y="130" font-size="11" fill="#888">Inside (protected volume)</text>

    <!-- Layer 1: outer paint/coating -->
    <rect x="0" y="40" width="10" height="180" fill="#dedede" stroke="#999" stroke-width="1"/>
    <!-- Layer 2: copper shielding sheet -->
    <rect x="10" y="40" width="26" height="180" fill="url(#hatchCopper)" stroke="#7a4420" stroke-width="1.5"/>
    <!-- Layer 3: structural backing (steel) -->
    <rect x="36" y="40" width="34" height="180" fill="#b9c2cc" stroke="#5c6672" stroke-width="1.5"/>
    <!-- Seam overlap w/ conductive gasket -->
    <rect x="70" y="60" width="14" height="140" fill="url(#hatchGasket)" stroke="#222" stroke-width="1"/>
    <!-- Inner liner -->
    <rect x="84" y="40" width="8" height="180" fill="#eaf1fb" stroke="#0b3d91" stroke-width="1"/>

    <!-- dimension: total thickness -->
    <line x1="0" y1="230" x2="92" y2="230" stroke="#222" stroke-width="1"/>
    <line x1="0" y1="224" x2="0" y2="236" stroke="#222" stroke-width="1"/>
    <line x1="92" y1="224" x2="92" y2="236" stroke="#222" stroke-width="1"/>
    <text x="46" y="248" text-anchor="middle" font-size="10.5" fill="#222">t_wall (spec per project, e.g. 1.0&#8211;2.0 mm Cu)</text>

    <!-- callouts -->
    <g font-size="10" fill="#333">
      <line x1="5" y1="40" x2="5" y2="20" stroke="#999" stroke-width="1"/>
      <text x="5" y="14" text-anchor="middle">coating</text>

      <line x1="23" y1="40" x2="23" y2="0" stroke="#7a4420" stroke-width="1"/>
      <text x="23" y="-6" text-anchor="middle" font-weight="700" fill="#7a4420">Cu sheet</text>

      <line x1="53" y1="40" x2="53" y2="30" stroke="#5c6672" stroke-width="1"/>
      <text x="60" y="26" text-anchor="start">structural steel</text>

      <line x1="77" y1="60" x2="140" y2="30" stroke="#222" stroke-width="1"/>
      <text x="145" y="28" font-weight="700">conductive gasket</text>
      <text x="145" y="42" font-size="9.5" fill="#555">(beryllium-copper finger stock</text>
      <text x="145" y="54" font-size="9.5" fill="#555">or conductive elastomer)</text>

      <line x1="88" y1="40" x2="88" y2="20" stroke="#0b3d91" stroke-width="1"/>
      <text x="88" y="14" text-anchor="middle" fill="#0b3d91">inner liner</text>
    </g>

    <!-- note box -->
    <rect x="0" y="270" width="300" height="120" rx="6" fill="#fffaf0" stroke="#b58900" stroke-dasharray="5 4"/>
    <text x="12" y="290" font-size="11" font-weight="700" fill="#7a5c00">SEAM IS THE WEAK POINT</text>
    <text x="12" y="308" font-size="10" fill="#333">Any gap, unbonded seam, or cable</text>
    <text x="12" y="322" font-size="10" fill="#333">penetration acts as a slot antenna and</text>
    <text x="12" y="336" font-size="10" fill="#333">can dominate total leakage regardless</text>
    <text x="12" y="350" font-size="10" fill="#333">of how good the flat-panel SE is.</text>
    <text x="12" y="368" font-size="10" fill="#333">Gasket contact must be continuous —</text>
    <text x="12" y="382" font-size="10" fill="#333">verify per docs/test_procedures.md.</text>
  </g>

  <!-- ============ Full enclosure elevation (right) ============ -->
  <g transform="translate(560,90)">
    <text x="190" y="-10" text-anchor="middle" font-size="13" font-weight="700" fill="#0b3d91">ENCLOSURE ELEVATION</text>

    <rect x="0" y="20" width="380" height="260" rx="4" fill="#eaf1fb" stroke="#0b3d91" stroke-width="3"/>
    <rect x="10" y="30" width="360" height="240" fill="none" stroke="#0b3d91" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="20" y="44" text-anchor="start" font-size="11" fill="#0b3d91">Faraday cage — continuous Cu shell</text>

    <!-- access panel with gasket outline -->
    <rect x="30" y="80" width="110" height="150" rx="4" fill="#ffffff" stroke="#222" stroke-width="2"/>
    <rect x="26" y="76" width="118" height="158" rx="4" fill="none" stroke="url(#hatchGasket)" stroke-width="6"/>
    <text x="85" y="245" text-anchor="middle" font-size="10">Access panel</text>
    <text x="85" y="258" text-anchor="middle" font-size="9" fill="#555">gasketed on all 4 edges</text>

    <!-- cable penetration with waveguide-below-cutoff bushing -->
    <circle cx="220" cy="120" r="16" fill="#fff" stroke="#7a1f1f" stroke-width="2"/>
    <line x1="220" y1="120" x2="220" y2="60" stroke="#7a1f1f" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="225" y="50" font-size="10" fill="#7a1f1f">Cable penetration —</text>
    <text x="225" y="63" font-size="10" fill="#7a1f1f">waveguide-below-cutoff bushing</text>

    <!-- sensor mounted near wall, feeding into enclosure -->
    <rect x="270" y="150" width="80" height="26" rx="4" fill="#0b3d91"/>
    <text x="310" y="167" text-anchor="middle" font-size="10" fill="#fff">Sensor feedthrough</text>
    <line x1="310" y1="150" x2="310" y2="105" stroke="#0b3d91" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="310" y="98" text-anchor="middle" font-size="9.5" fill="#0b3d91">to Rogowski coil (see mount detail)</text>

    <!-- protected equipment inside -->
    <rect x="150" y="190" width="180" height="60" rx="4" fill="#e8f3e8" stroke="#1f6e1f" stroke-width="1.5"/>
    <text x="240" y="215" text-anchor="middle" font-size="11" fill="#1f6e1f" font-weight="600">Protected equipment</text>
    <text x="240" y="230" text-anchor="middle" font-size="9.5" fill="#1f6e1f">inside shielded volume only</text>
  </g>

  <text x="500" y="590" text-anchor="middle" font-size="10" fill="#888">Source: docs/hardware_specs.md (passive shielding), README.md honesty notes — EMP-Guardian, Ciprian &#536;tefan Ple&#537;ca</text>
  <text x="500" y="606" text-anchor="middle" font-size="10" fill="#888">Reference target: &gt;80 dB attenuation up to 10 GHz for the enclosure — validate by measurement, not by this drawing.</text>
</svg>
